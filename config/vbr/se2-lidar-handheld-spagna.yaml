general:
  # outputs
  results_directory:          "/home/"
  write_mesh_output: false

  # Sensor processing
  sensor_measurement_downsampling: 1
  depth_image_resolution_downsampling: 2

  # Submapping
  submap_kf_threshold: 5
  submap_overlap_ratio: 0.4
  submap_min_frames: 40
  near_plane: 0.4
  far_plane: 30.0

  # Alignment settings
  use_map_to_map_factors: true
  use_map_to_live_factors: true
  # Plane-only LiDAR: no occupancy allocation/fusion, mesh extraction or output.
  use_point_to_plane_factors: true
  lidar_plane_only: true
  build_lidar_pointcloud_map: true
  pointcloud_map_global: true # fixed-resolution full-history visual map in RAM
  # Bound local registration; the global visual map retains history in RAM.
  memory_archive_directory: "./okvis-history" # used only if LiDAR spool/chunks are explicitly enabled
  max_submaps: 32 # shared cloud/plane retention target; active/reference maps are protected
  plane_active_max_cells: 8192
  plane_window_half_extent: 50.0 # m; local sliding plane window
  lidar_spool_enabled: false # RAM: one active scan + one latest waiting scan; true: lossless mapping spool
  pointcloud_persistent_chunks: false # RAM map; no historical point-cloud files
  pointcloud_window_half_extent: 50.0 # m; world-frame sliding point-cloud window half extent
  mapping_queue_max_frames: 4
  state_queue_max_updates: 32
  pointcloud_map_voxel_size: 0.1        # m; accumulated XYZ map sampling
  pointcloud_map_publish_interval: 1.0  # seconds of wall time; 0 publishes every change
  plane_voxel_size: 1.0          # m; independent of occupancy/downsampling resolution
  plane_max_variance: 0.01      # m^2; maximum smallest PCA eigenvalue
  plane_eigenvalue_ratio: 0.1   # lambda_min / lambda_mid
  plane_max_match_distance: 0.3 # m; additional sigma gate also applies
  plane_noise_floor: 0.03       # m; residual standard deviation floor
  plane_sigma_gate: 3.0
  plane_min_points: 6
  plane_max_points: 100
  n_factors_per_state: 100 # number of points per depth images
  voxel_grid_resolution: 0.05
  sensor_error: 0.05 # 1-sigma for obsv. noise [m]


map:
  dim:                        [51.2, 51.2, 51.2]
  res:                        0.2

data:
  # occupancy
  surface_boundary:           0
  min_occupancy:              -100
  max_occupancy:               100
  log_odd_min:                -5.015
  log_odd_max:                 5.015
  fs_integr_scale:            1
  const_surface_thickness:    false
  uncertainty_model:          linear
  tau_min_factor:             3
  tau_max_factor:             12
  k_tau:                      0.03
  sigma_min_factor:           1         # minimum/maximum uncertainty := 3 x sigma_min_factor/sigma_max_factor * voxel_dim
  sigma_max_factor:           3         # minimum/maximum uncertainty := 3 x sigma_min_factor/sigma_max_factor * voxel_dim
  k_sigma:                    0.05
